<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./homePage/styles/main.css">
    <link rel="shortcut icon" href="./assets/filme.png" type="image/x-icon">
    <title>Filmes Online</title>
</head>

<body>
    <nav class="bg-color" id="nav">
        <div class="container-pesquisar">
            <div class="box-logo">
                <a href="" class="navbar-brand"><img class="logo"
                        src="/assets/textFilmes__create_a_logo_for_a_site_of_movi-removebg-preview.png" alt="">
                </a>
                <div id="ordenar" onmouseover="showOrdem()" onmouseleave="hideOrdem()">
                    <input type="button" value="Filmes" class="gen-btn" id="filmes-btn">
                    <ul id="order-list" class="hide">
                        <li class="genero" onclick='moviesOrder("popularity.desc" , "Populares")'>Populares</li>
                        <li class="genero" onclick='moviesOrder("revenue.desc" , "Maiores bilheterias")'>Maiores
                            bilheterias</li>
                        <li class="genero" onclick='moviesOrder("primary_release_date.desc" , "Futuros Lançamentos")'>
                            Futuros Lançamentos</li>
                    </ul>
                </div>
                <div class="generos" id="text-gender" onmouseover="showGenders()" onmouseleave="hideGenders()">
                    <input type="button" value="Gêneros" class="gen-btn">
                    <ul id="gender-list" class="hide">
                    </ul>
                </div>
            </div>

        </div>
    </nav>


    <div class="welcome-box">
        <h1 class="welcome-text"><strong>Bem-vindo(a).</strong></h1>
        <h2 class="sub-welcome-text"><strong>Milhões de filme para descobrir. Explore já!</strong></h2>
        <div class="box-pesquisar">
            <input onchange="pesquisarFilme()" type="text" id="pesquisar" placeholder="Pesquisar nome do filme"
                class="hideAnimation">
            <img onclick="showHide()" class="lupa" src="./assets/lupa.png">
        </div>
    </div>
    <div id="pre-load">
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
        <div class="load"></div>
    </div>

    <div class="box-titulo-pesquisa">
        <h3 id="titulo-pesquisa">Tendências</h3>
        <div class="hoje-bg">
            <p id="sub-titulo" class="hoje">Hoje</p>
        </div>

    </div>

    <header id="box" class="cards">
    </header>
    <footer class="footer bg-color" id="footer">

    </footer>

    <script src="/homePage/scripts/script.js"></script>
    <script src="/homePage/scripts/functions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
